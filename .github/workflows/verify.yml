name: verify-preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
# No credentials, publishing or real app/model integration runs in CI.
